name: Build Quartz Client
on:
  push:
    branches: ["quartz-mod-first-build", "quartz-cosmetics", "quartz-refinements", "quartz-version-ports"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-mod:
    strategy:
      fail-fast: false
      matrix:
        target:
          - { id: "1.21.8", project: "quartz-mod", api: "0.136.1+1.21.8" }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Prepare version-specific Java sources
        run: python3 scripts/prepare-quartz-port.py ${{ matrix.target.id }} ${{ matrix.target.project }}
      - name: Compile Quartz mod
        run: gradle -p ${{ matrix.target.project }} -Pminecraft_version=${{ matrix.target.id }} -Pfabric_api_version=${{ matrix.target.api }} build
