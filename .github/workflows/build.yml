name: Build Quartz Client
on:
  push:
    branches: ["quartz-mod-first-build", "quartz-cosmetics", "quartz-refinements", "quartz-version-picker", "quartz-version-ports"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: versions
        run: echo "matrix=$(jq -c . src/quartz-build-targets.json)" >> "$GITHUB_OUTPUT"
  build-mod:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.8.2"
      - name: Prepare matching Java sources
        if: matrix.target.port
        run: python3 scripts/prepare-quartz-port.py ${{ matrix.target.id }} ${{ matrix.target.project }}
      - name: Compile Quartz mod
        shell: bash
        run: |
          args=(-p "${{ matrix.target.project }}" "-Pminecraft_version=${{ matrix.target.id }}" "-Pfabric_api_version=${{ matrix.target.api }}" build)
          log="$RUNNER_TEMP/gradle-build.log"
          set -o pipefail
          if gradle "${args[@]}" 2>&1 | tee "$log"; then exit 0; fi
          if grep -qiE 'Could not resolve all artifacts|Could not GET|Read timed out' "$log"; then
            gradle "${args[@]}" --refresh-dependencies
          else
            exit 1
          fi
      - name: Stage the runtime mod JAR
        shell: bash
        run: |
          mkdir -p dist
          jar=$(find "${{ matrix.target.project }}/build/libs" -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' | head -n 1)
          test -n "$jar"
          jar tf "$jar" > dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzModClient.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzTitleScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzWardrobeScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzModListScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzHudEditorScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzSettingsScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzSafeScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzHud.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzHudModule.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzHudSettingsScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzPackDetailsScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzPackVersionScreen.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzPackDownloads.class' dist/jar-entries.txt
          grep -Fx 'assets/quartz/textures/wardrobe/quartz-crystal.png' dist/jar-entries.txt
          grep -Fx 'assets/quartz/textures/gui/app-crystal.png' dist/jar-entries.txt
          grep -E '^META-INF/jars/imageio-webp-.*\.jar$' dist/jar-entries.txt
          grep -Fx 'com/quartz/QuartzServerStyle.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/QuartzStyleLayer.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/mixin/QuartzChatMixin.class' dist/jar-entries.txt
          grep -Fx 'com/quartz/client/mixin/QuartzCapeMixin.class' dist/jar-entries.txt
          grep -Fx 'assets/quartz/style-catalog.json' dist/jar-entries.txt
          grep -Fx 'assets/quartz/textures/wardrobe/web-suit.png' dist/jar-entries.txt
          grep -Fx 'assets/quartz/textures/wardrobe/style-material.png' dist/jar-entries.txt
          grep -Fx 'fabric.mod.json' dist/jar-entries.txt
          cp "$jar" "dist/Quartz-Client-Mod-${{ matrix.target.id }}.jar"
          ls -lh dist
      - name: Launch Minecraft to its main menu
        if: matrix.target.port
        shell: bash
        run: |
          log="$RUNNER_TEMP/quartz-launch.log"
          setsid xvfb-run -a gradle -p ${{ matrix.target.project }} -Pminecraft_version=${{ matrix.target.id }} -Pfabric_api_version=${{ matrix.target.api }} runClient > "$log" 2>&1 &
          game=$!
          trap 'kill -TERM -- "-$game" 2>/dev/null || true' EXIT
          for i in {1..76}; do
            if grep -q 'Created: .*minecraft:textures/atlas/gui.png-atlas' "$log"; then
              sleep 5
              if kill -0 "$game" 2>/dev/null && ! grep -qiE 'Game crashed|MixinApplyError|Critical injection failure' "$log"; then
                echo "Minecraft ${{ matrix.target.id }} reached the main menu"
                exit 0
              fi
            fi
            kill -0 "$game" 2>/dev/null || break
            sleep 3
          done
          tail -245 "$log"
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: quartz-client-mod-${{ matrix.target.id }}
          path: dist/*.jar
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    needs: build-mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          pattern: quartz-client-mod-*
          path: downloaded-mods
      - name: Bundle Fabric builds and their dependencies
        shell: bash
        run: |
          node -p "require('./src/quartz-build-targets.json').map(({id,api}) => id+' '+api).join('\n')" |
          while read -r mc api; do
            folder="quartz-mods/fabric/$mc"
            mkdir -p "$folder"
            mv "downloaded-mods/quartz-client-mod-$mc/Quartz-Client-Mod-$mc.jar" "$folder/quartz-client.jar"
            curl --fail --location --retry 3 "https://maven.fabricmc.net/net/fabricmc/fabric-api/fabric-api/$api/fabric-api-$api.jar" -o "$folder/fabric-api.jar"
          done
      - run: npm install --no-audit --no-fund
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Verify packaged startup files and bundled Fabric mods
        run: node scripts/verify-windows-package.cjs
      - name: Open the Windows launcher twice and check the Minecraft version picker
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright-core@1.58.2
          node scripts/smoke-windows-launcher.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: Quartz-Client-Windows
          path: dist/Quartz-Client-*.exe
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Quartz-Client-Windows
          path: release-files
      - uses: actions/download-artifact@v4
        with:
          pattern: quartz-client-mod-*
          path: release-files
          merge-multiple: true
      - name: Publish the Windows installer and server mods
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" release-files/Quartz-Client-Setup-*.exe release-files/Quartz-Client-Mod-*.jar --verify-tag --generate-notes --title "Quartz Client $version"
