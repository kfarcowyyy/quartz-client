plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

repositories {
    maven {
        name = "MavenCentralLwjglFallback"
        url = uri("https://repo1.maven.org/maven2/")
        content { includeGroup "org.lwjgl" }
    }
    mavenCentral()
}

def minecraftMinor = project.minecraft_version.tokenize(".")[1].toInteger()
def supportsSplitEnvironment = minecraftMinor >= 18 && !(project.minecraft_version in ['1.18', '1.18.1'])

loom {
    if (supportsSplitEnvironment) splitEnvironmentSourceSets()
    mods {
        "quartz" {
            sourceSet sourceSets.main
            if (supportsSplitEnvironment) sourceSet sourceSets.client
        }
    }
}

if (!supportsSplitEnvironment) {
    sourceSets.main.java.srcDir "src/client/java"
    sourceSets.main.resources.srcDir "src/client/resources"
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Native-free image decoder for WebP project assets from Modrinth.
    def imageVersion = "3.15.3"
    implementation "com.twelvemonkeys.imageio:imageio-webp:${imageVersion}"
    ["imageio-webp", "imageio-core", "imageio-metadata"].each {
        include "com.twelvemonkeys.imageio:${it}:${imageVersion}"
    }
    ["common-lang", "common-io", "common-image"].each {
        include "com.twelvemonkeys.common:${it}:${imageVersion}"
    }
}

processResources {
    from('../src/style-catalog.json') { into 'assets/quartz' }
    from('../renderer/style-material.png') { into 'assets/quartz/textures/wardrobe' }
    from('../renderer/web-suit.png') { into 'assets/quartz/textures/wardrobe' }
    from('../renderer/style-previews.png') { into 'assets/quartz/textures/wardrobe' }
    inputs.property 'version', project.version
    inputs.property 'minecraftVersion', project.minecraft_version
    filesMatching('fabric.mod.json') { expand version: project.version, minecraftVersion: project.minecraft_version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
}
